name: App status

on:
  schedule:
    # Toutes les 5 min (minimum GitHub ; dépôt public = minutes gratuites).
    # GitHub peut décaler ou sauter des passages quand il est chargé.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Reposter le tableau maintenant, même sans changement'
        type: boolean
        default: false
      demo:
        description: 'Démo : 3 faux changements sur Parkeur (10 s d''écart), supprimés après 1 min'
        type: boolean
        default: false

# Un seul passage à la fois : deux passages simultanés posteraient deux fois.
concurrency:
  group: app-status
  cancel-in-progress: false

permissions:
  contents: write # commit de state.json

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Vérifier les statuts et poster sur Discord
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          IGNORED_APPS: ${{ vars.IGNORED_APPS }}
          IGNORED_BUNDLE_IDS: ${{ vars.IGNORED_BUNDLE_IDS }}
        run: node src/index.mjs ${{ inputs.demo && '--demo' || '' }} ${{ inputs.refresh && '--refresh' || '' }}

      - name: Enregistrer l'état
        run: |
          git config user.name "app-status"
          git config user.email "app-status@users.noreply.github.com"
          if [ -n "$(git status --porcelain state.json)" ]; then
            git add state.json
            git commit -m "chore: état des apps"
            git push
          elif [ $(( $(date +%s) - $(git log -1 --format=%ct) )) -gt $(( 50 * 86400 )) ]; then
            # Dépôt public : GitHub suspend les crons après 60 jours sans
            # activité. Un commit vide tous les 50 jours sans changement l'évite.
            git commit --allow-empty -m "chore: maintien du cron"
            git push
          fi
